name: MeteoIQ
on:
  schedule:
    - cron: "10 */6 * * *"   # كل 6 ساعات (UTC)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: meteoiq
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: استرجاع الحالة
        run: |
          mkdir -p state
          git fetch -q --depth=1 origin data && git archive FETCH_HEAD | tar -x -C state || echo "أول تشغيل"
      - name: بناء الموقع
        run: python build.py
      - name: حفظ الحالة في فرع data
        run: |
          D=$(mktemp -d)
          cp state/* "$D/"
          cd "$D"
          git init -q -b data
          git config user.name meteoiq-bot
          git config user.email bot@users.noreply.github.com
          git add .
          git commit -qm "state"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
      - name: نشر على Cloudflare Pages (إن أضفت الأسرار)
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          npx --yes wrangler@3 pages project create meteoiq --production-branch=main || true
          npx --yes wrangler@3 pages deploy site --project-name=meteoiq --branch=main
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - id: dep
        uses: actions/deploy-pages@v4
